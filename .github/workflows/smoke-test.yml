name: JARVIS smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile jarvis.py
      - name: Uzbek command smoke test
        run: python jarvis.py --text "nimalar qila olasan" --no-voice
